name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    name: "PHPUnit (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json declares "php": ">=5.3", and src/Filesystem.php has
        # been verified by hand against real PHP 5.3.10 (not just `php -l`
        # on a newer runtime) — no short array syntax `[]`, no
        # `(new Foo())->bar()` chaining, no function-result array
        # dereferencing, no `::class` — see wilkques/console's CI comments
        # for the same set of PHP 5.4+/5.5+ traps this package also avoids.
        #
        # 5.3 runs through shivammathur/setup-php@v2 the same as every
        # other version here, same as wilkques/php-helper, wilkques/cache,
        # and wilkques/config's own CI — it ships prebuilt binaries for
        # versions this old and already picks a Composer release compatible
        # with whatever PHP version it just installed, so no separate
        # Docker-based job or manual old-Composer download is needed.
        php: ['5.3', '5.6', '7.0', '7.1', '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run test suite
        run: vendor/bin/phpunit -c phpunit.xml
